name: Build laguna kernel

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Which kernels to build"
        required: false
        default: "both"
        type: choice
        options: [both, stable, susfs]
      lineage_branch:
        description: "LineageOS gs-6.6 manifest branch to read the ACK tag from"
        required: false
        default: "lineage-24.0"
        type: string
      ack_tag:
        description: "ACK tag override (e.g. android15-6.6-2026-04_r33); empty = whatever Lineage pins"
        required: false
        default: ""
        type: string
      ksun_tag:
        description: "stable: KernelSU-Next release tag (its manager apk pairs with it); latest = newest release"
        required: false
        default: "latest"
        type: string
      ksun_susfs_ref:
        description: "susfs: ref on pershoot/KernelSU-Next (branch, tag or sha)"
        required: false
        default: "dev-susfs"
        type: string
      make_release:
        description: "Publish a GitHub Release"
        required: false
        default: true
        type: boolean
  schedule:
    # Sundays 04:20 UTC
    - cron: "20 4 * * 0"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.plan.outputs.flavors }}
      stamp: ${{ steps.plan.outputs.stamp }}
    steps:
      - id: plan
        run: |
          case "${{ inputs.flavor || 'both' }}" in
            both)   f='["stable","susfs"]' ;;
            stable) f='["stable"]' ;;
            susfs)  f='["susfs"]' ;;
            *) echo "bad flavor" >&2; exit 1 ;;
          esac
          echo "flavors=$f" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    name: ${{ matrix.flavor }} (GKI android15-6.6 + Droidspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.prep.outputs.flavors) }}
    env:
      FLAVOR: ${{ matrix.flavor }}
      BUILD_STAMP: ${{ needs.prep.outputs.stamp }}
      LINEAGE_BRANCH_INPUT: ${{ inputs.lineage_branch || 'lineage-24.0' }}
      ACK_TAG_INPUT: ${{ inputs.ack_tag || '' }}
      KSUN_TAG: ${{ inputs.ksun_tag || 'latest' }}
      KSUN_SUSFS_REF: ${{ inputs.ksun_susfs_ref || 'dev-susfs' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Kleaf + a full ACK checkout need ~60 GB; the runner image ships ~90 GB free.
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.2.0"
          testing: false

      - name: Swap for LTO
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 5 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false

      - name: Resolve ACK tag from Lineage manifest
        run: scripts/resolve-kernel.sh "$LINEAGE_BRANCH_INPUT" "$ACK_TAG_INPUT"

      - name: Sync kernel source
        run: scripts/sync-kernel.sh

      - name: KernelSU-Next
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/setup-ksun.sh

      - name: susfs
        if: matrix.flavor == 'susfs'
        run: scripts/setup-susfs.sh

      - name: Droidspaces-OSS
        run: scripts/setup-droidspaces.sh

      - name: Prepare tree (branding, exports, defconfig gate)
        run: scripts/prepare-build.sh

      - name: Build
        run: scripts/build-kernel.sh

      - name: Package AnyKernel3 zip
        run: scripts/package-ak3.sh

      - name: Collect patch rejects
        if: failure()
        run: |
          mkdir -p out/rejects
          find kernel/common -name '*.rej' -newer kernel/common/Makefile -exec cp --parents {} out/rejects/ \; 2>/dev/null || true
          ls -R out/rejects || true

      - name: Upload rejects
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: patch-rejects-${{ matrix.flavor }}
          path: out/rejects/
          if-no-files-found: ignore

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: laguna-${{ matrix.flavor }}
          path: |
            out/*.zip
            out/*.sha256
            out/header.md
            out/notes-*.md
            out/release.env
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [prep, build]
    # one release per run, carrying whichever flavors built
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.make_release == true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: laguna-*
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          ls -la
          ls ./*.zip >/dev/null 2>&1 || { echo "no flavor built; nothing to release" >&2; exit 1; }
          . ./release.env
          { cat header.md; for f in notes-stable.md notes-susfs.md; do [ -f "$f" ] && cat "$f"; done; } > notes.md
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file notes.md \
            ./*.zip ./*.sha256
